name: "Podcast Generator MKY"
author: "Will Liu"
description: "Generates a fedd for a podast from a YAML file"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: The committer's email address
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: Thecommtter's name
    required: true
    default: ${{ github.actor }}
 
